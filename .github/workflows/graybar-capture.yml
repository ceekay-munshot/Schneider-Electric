name: Graybar UPS Capture

on:
  workflow_dispatch:
    inputs:
      debug:
        description: "Print counts & field-presence diagnostics only (never secrets)"
        type: boolean
        default: false
      enrich_cap:
        description: "Limit price enrichment to N products (blank = all). Use a small N to validate."
        type: string
        default: ""
  # Weekly — Mondays at 03:30 UTC (offset from the Rexel job).
  schedule:
    - cron: "30 3 * * 1"

# contents: write so a successful weekly capture can publish its data and the
# Cloudflare Pages dashboard auto-refreshes. (Enabled at the user's direction.)
permissions:
  contents: write

concurrency:
  group: graybar-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    # Map GitHub secrets -> env vars with the EXACT names the scraper reads.
    env:
      GRAYBAR_EMAIL: ${{ secrets.GRAYBAR_EMAIL }}
      GRAYBAR_PASSWORD: ${{ secrets.GRAYBAR_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fail clearly if either secret is missing — without printing values.
      - name: Validate secrets are present
        run: |
          test -n "$GRAYBAR_EMAIL" || { echo "Missing GRAYBAR_EMAIL"; exit 1; }
          test -n "$GRAYBAR_PASSWORD" || { echo "Missing GRAYBAR_PASSWORD"; exit 1; }
          echo "Graybar secrets are present."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Graybar capture
        env:
          DEBUG: ${{ inputs.debug }}
          GRAYBAR_ENRICH_CAP: ${{ inputs.enrich_cap }}
        run: npm run capture:graybar

      # Runs only when the capture step succeeded (status=ok); the publisher also
      # refuses to publish a non-"ok" capture. Pushing the data triggers a
      # Cloudflare Pages rebuild so the dashboard reflects the weekly capture.
      - name: Publish capture to dashboard data
        run: node scripts/publish-dashboard-data.js output/graybar-ups-latest.json public/data/latest-capture.json

      - name: Commit dashboard data
        run: |
          if git diff --quiet -- public/data/latest-capture.json; then
            echo "No dashboard data change; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/latest-capture.json
          git commit -m "data: weekly Graybar capture refresh [skip ci]"
          git pull --rebase --autostash origin main || true
          git push

      - name: Upload capture artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graybar-ups-capture-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 30
