name: Graybar Capture

on:
  workflow_dispatch:
    inputs:
      category:
        description: "What to capture: all | stale (only categories without a good capture this week) | slug(s), comma-separated: ups, busway, rack-pdus, rack-systems, dcim, pod-modular"
        type: string
        default: "all"
      debug:
        description: "Print counts & field-presence diagnostics only (never secrets)"
        type: boolean
        default: false
      enrich_cap:
        description: "Limit price enrichment to N products (blank = all). Use a small N to validate."
        type: string
        default: ""
  # Daily at 03:30 UTC, self-healing: each run captures only the categories
  # that have no good capture yet in the current ISO week (see
  # scripts/plan-captures.js). Monday's run captures everything; any category
  # that failed, timed out or came back with thin price coverage is re-tried on
  # the following days until the week has a good data point.
  schedule:
    - cron: "30 3 * * *"

# contents: write so a successful capture can publish its data and the Cloudflare
# Pages dashboard auto-refreshes. (Enabled at the user's direction.)
permissions:
  contents: write

concurrency:
  group: graybar-capture
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      # Plan against the newest published data (a queued run may start long
      # after it was triggered).
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Plan captures
        id: plan
        env:
          PLAN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.category || 'stale' }}
        run: node scripts/plan-captures.js

  capture:
    needs: plan
    if: ${{ needs.plan.outputs.count != '0' }}
    name: capture (${{ matrix.slug }})
    runs-on: ubuntu-latest
    # Hosted runners allow 360. The scraper stops itself at
    # GRAYBAR_TIME_BUDGET_MIN and writes what it captured well before this, so
    # a slow week yields partial data instead of a cancelled job with nothing.
    timeout-minutes: 330

    # One slice per category from the plan, run sequentially (max-parallel: 1):
    # one Graybar session at a time. Add a category by adding a {slug, url} entry
    # to scripts/graybar-targets.json and a live entry in src/categories.js.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    env:
      GRAYBAR_EMAIL: ${{ secrets.GRAYBAR_EMAIL }}
      GRAYBAR_PASSWORD: ${{ secrets.GRAYBAR_PASSWORD }}
      GRAYBAR_CATEGORY: ${{ matrix.slug }}
      GRAYBAR_SEARCH_URL: ${{ matrix.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate secrets are present
        run: |
          test -n "$GRAYBAR_EMAIL" || { echo "Missing GRAYBAR_EMAIL"; exit 1; }
          test -n "$GRAYBAR_PASSWORD" || { echo "Missing GRAYBAR_PASSWORD"; exit 1; }
          echo "Graybar secrets are present."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          for i in 1 2 3; do npm ci && exit 0; echo "npm ci failed (attempt $i); retrying"; sleep $((i * 20)); done
          exit 1

      - name: Install Playwright browsers
        run: |
          for i in 1 2 3; do npx playwright install --with-deps chromium && exit 0; echo "playwright install failed (attempt $i); retrying"; sleep $((i * 20)); done
          exit 1

      # exec node directly (not via npm or a bash child) so a job timeout's
      # SIGINT reaches the scraper, which then writes what it captured.
      - name: Run capture (${{ matrix.slug }})
        id: capture
        env:
          DEBUG: ${{ inputs.debug }}
          GRAYBAR_ENRICH_CAP: ${{ inputs.enrich_cap }}
          GRAYBAR_TIME_BUDGET_MIN: "290"
        run: exec node src/capture-graybar.js

      # Runs on success, failure AND cancel: records the attempt (streak, last
      # success, run link) so the dashboard shows a failure banner instead of
      # silently aging, and publishes the data if the capture produced real
      # prices (publish-dashboard-data.js refuses anything else). Copied out of
      # the work tree because the script resets it to the latest origin/main.
      - name: Record health, publish and commit
        if: ${{ always() && steps.capture.conclusion != 'skipped' }}
        env:
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cp scripts/commit-capture.sh "$RUNNER_TEMP/commit-capture.sh"
          bash "$RUNNER_TEMP/commit-capture.sh" "${{ matrix.slug }}"

      # Public repo: any logged-in GitHub user can download artifacts. The debug
      # set (full-page HTML, screenshots, raw API payloads) comes from an
      # authenticated distributor session and can expose the account identity
      # and negotiated pricing — so successful runs upload data files only.
      - name: Upload capture data
        if: ${{ always() && (steps.capture.outcome == 'success' || steps.capture.outcome == 'cancelled') }}
        uses: actions/upload-artifact@v4
        with:
          name: graybar-${{ matrix.slug }}-capture-${{ github.run_id }}
          path: |
            output/graybar-${{ matrix.slug }}-latest.json
            output/graybar-${{ matrix.slug }}-2*.json
            output/graybar-${{ matrix.slug }}-2*.csv
          if-no-files-found: warn
          retention-days: 30

      # Full debug set only when the capture failed, kept a week — enough to
      # diagnose, not a standing exposure.
      - name: Upload debug artifacts (failed capture)
        if: ${{ always() && steps.capture.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: graybar-${{ matrix.slug }}-debug-${{ github.run_id }}
          path: output/
          if-no-files-found: ignore
          retention-days: 7
