name: Rexel UPS Capture

on:
  # Manual run from the Actions tab.
  workflow_dispatch:
    inputs:
      debug:
        description: "Print counts & field-presence diagnostics only (never secrets)"
        type: boolean
        default: false
  # Schedule paused: rexelusa.com is CAPTCHA/bot-walled, so scheduled runs only
  # ever fail (auth_failed_or_price_hidden). Manual dispatch is kept for testing;
  # re-enable by uncommenting if the Rexel login is ever solved.
  # schedule:
  #   - cron: "30 2 * * 1"

# Least privilege: this job only needs to read the repo.
permissions:
  contents: read

# Avoid overlapping captures hammering the site.
concurrency:
  group: rexel-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Map GitHub secrets -> env vars with the EXACT names the scraper reads.
    env:
      REXELUSA_EMAIL: ${{ secrets.REXELUSA_EMAIL }}
      REXELUSA_PASSWORD: ${{ secrets.REXELUSA_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fail clearly if either secret is missing — without printing values.
      - name: Validate secrets are present
        run: |
          test -n "$REXELUSA_EMAIL" || { echo "Missing REXELUSA_EMAIL"; exit 1; }
          test -n "$REXELUSA_PASSWORD" || { echo "Missing REXELUSA_PASSWORD"; exit 1; }
          echo "Rexel secrets are present."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Rexel capture
        env:
          # Empty for scheduled runs (off); 'true' when dispatched with debug on.
          DEBUG: ${{ inputs.debug }}
        run: npm run capture:rexel

      # Always upload whatever was produced — including the diagnostic status
      # file written when a run is marked auth_failed_or_price_hidden.
      - name: Upload capture artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rexel-ups-capture-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 30
